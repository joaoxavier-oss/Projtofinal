<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personagens - Última Cidade</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="pagina-personagens">

    <a href="index.html" class="btn-voltar">← VOLTAR PARA A BASE</a>

    <section class="personagens">
        <h2 style="font-family: 'Orbitron'; color: white; text-align: center; text-transform: uppercase; margin-top: 40px;">
            Entidades da Última Cidade
        </h2>

        <div class="cards">
            <div class="card">
                <img src="imagem/foto-do-personagem.png" alt="Sobrevivente">
                <div class="card-info">
                    <h3>Alex</h3>
                    <p>Um sobrevivente determinado tentando chegar à segurança da Última Cidade.</p>
                </div>
            </div>

            <div class="card">
                <img src="imagem/zumbi masculino.jpg" alt="Zumbi Masculino">
                <div class="card-info">
                    <h3>Zumbi Masculino</h3>
                    <p>Lento, mas possui uma força física capaz de destruir barreiras.</p>
                </div>
            </div>

            <div class="card">
                <img src="imagem/foto-zumbi-feminino.png" alt="Zumbi Feminino">
                <div class="card-info">
                    <h3>Zumbi Feminino</h3>
                    <p>Agilidade extrema e sentidos apurados. Não deixe que ela te veja.</p>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
