<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Verificação de Idade</title>
</head>

<body style="display:flex; justify-content:center; align-items:center; height:100vh; background:#111; color:white; font-family:Arial;">

<div style="text-align:center;">
    <h1>Verificação de Idade</h1>

    <input id="idade" type="number" placeholder="Digite sua idade" style="padding:10px; width:200px;"><br><br>

    <button onclick="entrar()" style="padding:10px 20px; background:red; color:white; border:none; cursor:pointer;">
        Entrar
    </button>
</div>

<script>
function entrar() {
    let idade = document.getElementById("idade").value;

    if(idade >= 10) {
        sessionStorage.setItem("entrou", "true");
        window.location.href = "index.html"; // nome do seu site
    } else {
        alert("Você precisa ter pelo menos 10 anos para entrar 🚫");
    }
}
</script>

</body>
</html>
