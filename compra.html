<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Comprar o jogo - Última Cidade</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<section style="text-align:center; padding:80px;">

    <h1>Comprar o jogo - Última Cidade</h1>

    <h2 style="color:#00ff88;">R$ 29,90</h2>

    <p>Escolha a forma de pagamento:</p>

    <div style="margin-top:30px;">
        <!-- BOTÃO CARTÃO -->
        <button class="btn-comprar" onclick="window.location.href='cartao.html'">
            💳 Cartão
        </button>

        <!-- BOTÃO PIX -->
        <button class="btn-comprar" onclick="mostrarPix()">
            ⚡ Pix
        </button>
    </div>

    <!-- AREA DO PIX -->
    <div id="pixArea" style="display:none; text-align:center; margin-top:30px;">
        <h2>Escaneie o QR Code</h2>

        <img src="imagem/qrcodeitau.jpeg" width="200">
    </div>

</section>

<!-- JAVASCRIPT -->
<script>
function mostrarPix() {
    document.getElementById("pixArea").style.display = "block";
}
</script>

</body>
</html>
