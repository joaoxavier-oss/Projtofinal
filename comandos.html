<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <style>
        body { background: #000; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .caixa { border: 2px solid red; padding: 30px; border-radius: 15px; background: #111; width: 350px; text-align: center; box-shadow: 0 0 15px red; }
        h2 { color: red; margin-top: 0; }
        .row { display: flex; justify-content: space-between; align-items: center; margin: 15px 0; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .tecla { background: red; padding: 3px 10px; border-radius: 5px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>
    <div class="caixa">
        <h2>CONTROLES</h2>
        <div class="row"><span>Ir para frente</span><span class="tecla">&gt;</span></div>
        <div class="row"><span>Ir para trás</span><span class="tecla">&lt;</span></div>
        <div class="row"><span>Pular</span><span class="tecla">↑</span></div>
        <div class="row"><span>Atirar</span><span class="tecla">Botão Esquerdo</span></div>
    </div>
</body>
</html>
